(function(){var names=['shohojatri-logo','shohojatri-logo-en','shohojatri-mark','shohojatri-wordmark-bn','shohojatri-wordmark-en','shohojatri-wordmark'];var map={};var imgs=document.querySelectorAll('#pv-imgs img');names.forEach(function(n,i){map['assets/'+n+'.png']=imgs[i].src;});
function fix(el){if(el.tagName==='IMG'){var s=el.getAttribute('src');if(map[s]&&el.src!==map[s])el.src=map[s];}}
new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='attributes')fix(m.target);m.addedNodes&&m.addedNodes.forEach(function(n){if(n.nodeType===1){fix(n);n.querySelectorAll&&n.querySelectorAll('img').forEach(fix);}});});}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});})();
